<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="Inter, Helvetica, Arial, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B04922"/></marker>
</defs>
<rect width="1000" height="690" rx="12" fill="#FFFDF8"/>
<!-- shirt -->
<path d="M510,90 L410,125 L320,240 L365,280 L400,230 L405,590 L715,590 L720,230 L755,280 L800,240 L710,125 L610,90 Q560,135 510,90 Z" fill="#F2ECE0" stroke="#1D1A19" stroke-width="2" stroke-linejoin="round"/>
<path d="M400,230 L410,125 M720,230 L710,125" stroke="#1D1A19" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<path d="M510,90 L535,150 L560,125 L585,150 L610,90" fill="#FFFDF8" stroke="#1D1A19" stroke-width="2" stroke-linejoin="round"/>
<rect x="550" y="125" width="20" height="95" fill="none" stroke="#1D1A19" stroke-width="1.5"/>
<circle cx="560" cy="150" r="3" fill="#1D1A19"/><circle cx="560" cy="178" r="3" fill="#1D1A19"/><circle cx="560" cy="205" r="3" fill="#1D1A19"/>
<line x1="320" y1="240" x2="365" y2="280" stroke="#1D1A19" stroke-width="5"/>
<line x1="755" y1="280" x2="800" y2="240" stroke="#1D1A19" stroke-width="5"/>
<!-- centre front + heart line + logo zone -->
<line x1="560" y1="225" x2="560" y2="588" stroke="#6B5744" stroke-width="1.2" stroke-dasharray="6 5"/>
<line x1="572" y1="220" x2="705" y2="220" stroke="#6B5744" stroke-width="1.2" stroke-dasharray="6 5"/>
<rect x="605" y="208" width="85" height="24" rx="3" fill="#B0492218" stroke="#B04922" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="647" y="224" font-size="10" fill="#B04922" text-anchor="middle">ЛОГО</text>
<!-- side seam + measurement -->
<line x1="720" y1="230" x2="715" y2="590" stroke="#B04922" stroke-width="4"/>
<circle cx="720" cy="230" r="6" fill="#B04922"/><circle cx="715" cy="590" r="6" fill="#B04922"/>
<line x1="695" y1="245" x2="692" y2="575" stroke="#B04922" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text transform="translate(682,410) rotate(-90)" font-size="14" font-weight="600" fill="#B04922" text-anchor="middle">Довжина бічного шва</text>
<!-- right callouts -->
<g font-size="12" fill="#1D1A19">
<line x1="690" y1="208" x2="826" y2="132" stroke="#6B5744" stroke-width="1"/>
<text x="832" y="128" font-weight="600">6 · Лінія серця і лого</text>
<text x="832" y="145" fill="#6B5744"><tspan x="832">рівень низу планки;</tspan><tspan x="832" dy="15">лого – на лівих грудях</tspan><tspan x="832" dy="15">того, хто носить</tspan></text>
<line x1="726" y1="230" x2="826" y2="236" stroke="#B04922" stroke-width="1.2"/>
<text x="832" y="232" font-weight="600" fill="#B04922" font-size="14">A · Пахва</text>
<text x="832" y="250" fill="#1D1A19"><tspan x="832">точка під рукавом, де</tspan><tspan x="832" dy="15">рукав пришитий до</tspan><tspan x="832" dy="15">корпусу. Звідси</tspan><tspan x="832" dy="15" font-weight="600">починаємо міряти</tspan></text>
<line x1="719" y1="410" x2="826" y2="410" stroke="#B04922" stroke-width="1.2"/>
<text x="832" y="406" font-weight="600" fill="#B04922" font-size="14">B · Бічний шов</text>
<text x="832" y="424"><tspan x="832">шов збоку корпусу,</tspan><tspan x="832" dy="15">від пахви донизу.</tspan><tspan x="832" dy="15">Міряємо вздовж нього</tspan></text>
<line x1="721" y1="590" x2="826" y2="590" stroke="#B04922" stroke-width="1.2"/>
<text x="832" y="586" font-weight="600" fill="#B04922" font-size="14">C · Поділ</text>
<text x="832" y="604"><tspan x="832">нижній край виробу.</tspan><tspan x="832" dy="15" font-weight="600">Тут закінчуємо міряти</tspan></text>
</g>
<!-- left callouts -->
<g font-size="12" fill="#1D1A19" text-anchor="end">
<line x1="510" y1="90" x2="300" y2="62" stroke="#6B5744" stroke-width="1"/><circle cx="510" cy="90" r="4" fill="#6B5744"/>
<text x="294" y="58" font-weight="600">1 · Верхня точка плеча</text>
<text x="294" y="75" fill="#6B5744"><tspan x="294">де плечовий шов сходиться</tspan><tspan x="294" dy="15">з коміром; від неї міряють вниз</tspan></text>
<line x1="460" y1="108" x2="300" y2="150" stroke="#6B5744" stroke-width="1"/>
<text x="294" y="146" font-weight="600">2 · Плечовий шов</text>
<text x="294" y="163" fill="#6B5744">від коміра до краю плеча</text>
<line x1="342" y1="262" x2="300" y2="262" stroke="#6B5744" stroke-width="1"/>
<text x="294" y="258" font-weight="600">3 · Манжета</text>
<text x="294" y="275" fill="#6B5744">край рукава (резинка)</text>
<line x1="550" y1="175" x2="300" y2="360" stroke="#6B5744" stroke-width="1"/>
<text x="294" y="356" font-weight="600">4 · Планка</text>
<text x="294" y="373" fill="#6B5744">застібка з ґудзиками</text>
<line x1="560" y1="470" x2="300" y2="470" stroke="#6B5744" stroke-width="1"/>
<text x="294" y="466" font-weight="600">5 · Центр переду</text>
<text x="294" y="483" fill="#6B5744">вертикальна вісь посередині</text>
</g>
<!-- sides -->
<text x="408" y="615" font-size="11" fill="#6B5744" letter-spacing="1">← ПРАВО ВЛАСНИКА</text>
<text x="712" y="615" font-size="11" fill="#6B5744" letter-spacing="1" text-anchor="end">ЛІВО ВЛАСНИКА →</text>
<text x="500" y="660" font-size="13" fill="#1D1A19" text-anchor="middle">Вигляд спереду. Ліво і право – завжди з погляду того, хто носить: його ліві груди – праворуч на кресленні.</text>
</svg>
